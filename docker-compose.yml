services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      - LOCAL_API_PORT=3001
      - NODE_EXTRA_CA_CERTS=/app/local-ca.pem
    ports:
      - "3001:3001"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "5500:5500"
    depends_on:
      - backend
    restart: unless-stopped
