server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://b3v2z6iqdf.execute-api.eu-central-1.amazonaws.com https://eu-central-1fvi49dc6p.auth.eu-central-1.amazoncognito.com" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|woff2|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1h;
        try_files $uri =404;
    }

    location ~* \.html$ {
        expires -1;
    }
}
