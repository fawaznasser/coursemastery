<!DOCTYPE html>
<html lang="en">

<head>
    <title>CourseMastery Admin</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: "#0f172a",
                        shell: "#f3f7fb",
                        panel: "#ffffff",
                        focus: "#0284c7",
                        mastery: "#16a34a",
                        challenge: "#f59e0b",
                        gap: "#e11d48",
                        cyanx: "#0891b2",
                        bluex: "#2563eb"
                    },
                    fontFamily: {
                        sans: ["Manrope", "system-ui", "sans-serif"],
                        mono: ["IBM Plex Mono", "ui-monospace", "monospace"]
                    },
                    boxShadow: {
                        soft: "0 10px 30px rgba(15, 23, 42, 0.08)",
                        card: "0 2px 12px rgba(15, 23, 42, 0.08)"
                    }
                }
            }
        };
    </script>
    <style>
        body {
            background:
                linear-gradient(120deg, rgba(14, 165, 233, 0.12) 0 28%, transparent 28% 100%),
                linear-gradient(180deg, #f8fbff 0%, #eef6fb 48%, #f7fafc 100%);
            background-attachment: fixed;
        }

        .admin-panel {
            background: rgba(255, 255, 255, 0.96);
        }

        .field {
            background: linear-gradient(180deg, #ffffff, #f8fafc);
        }

        .action-card {
            transition: transform 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
        }

        .action-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 24px rgba(2, 132, 199, 0.13);
        }

        @media (max-width: 640px) {
            body {
                background-attachment: scroll;
            }

            .admin-panel {
                padding: 1rem;
            }

            .chapter-add-row,
            .form-actions,
            .course-card-actions,
            .chapter-card-actions {
                flex-direction: column;
            }

            .chapter-add-row > *,
            .form-actions > *,
            .course-card-actions > *,
            .chapter-card-actions > * {
                width: 100%;
            }
        }
    </style>
</head>

<body class="min-h-screen font-sans text-ink">
    <div class="mx-auto max-w-7xl px-4 py-5 md:px-6 md:py-8">
        <header class="mb-5 rounded-lg border border-blue-200/80 bg-white/95 p-4 shadow-soft backdrop-blur">
            <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
                <div class="mr-auto">
                    <h1 class="bg-gradient-to-r from-cyan-700 to-blue-800 bg-clip-text text-2xl font-extrabold tracking-tight text-transparent">CourseMastery Admin</h1>
                    <p class="text-xs font-semibold text-blue-800">Course and assessment content workspace</p>
                </div>
                <button id="backBtn" class="rounded-lg border border-cyan-700 bg-cyan-600 px-3 py-1.5 text-xs font-bold text-white shadow-sm hover:bg-cyan-700">Back to Study</button>
            </div>
        </header>

        <div class="grid gap-5 lg:grid-cols-[minmax(0,1.2fr)_minmax(0,1fr)]">
            <section class="admin-panel rounded-lg border border-blue-200 p-4 shadow-card md:p-5">
                <h2 id="formTitle" class="mb-3 text-lg font-extrabold text-blue-950">Add Course</h2>
                <form id="courseForm" class="space-y-3">
                    <div>
                        <label for="courseId" class="mb-1 block text-sm font-bold text-slate-700">Course ID</label>
                        <input id="courseId" class="field w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:border-bluex focus:outline-none focus:ring-2 focus:ring-blue-100" placeholder="course ID" required />
                    </div>
                    <div>
                        <label for="courseName" class="mb-1 block text-sm font-bold text-slate-700">Course Name</label>
                        <input id="courseName" class="field w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:border-bluex focus:outline-none focus:ring-2 focus:ring-blue-100" placeholder="course name" required />
                    </div>
                    <div>
                        <label for="courseDescription" class="mb-1 block text-sm font-bold text-slate-700">Description</label>
                        <textarea id="courseDescription" class="field w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:border-bluex focus:outline-none focus:ring-2 focus:ring-blue-100" rows="3"></textarea>
                    </div>

                    <div class="rounded-lg border border-blue-100 bg-blue-50 p-3">
                        <div class="mb-2 flex items-center justify-between">
                            <h3 class="font-extrabold text-blue-950">Chapters</h3>
                        </div>
                        <div class="chapter-add-row mb-3 flex gap-2">
                            <input id="chapterNameInput" class="field w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:border-bluex focus:outline-none focus:ring-2 focus:ring-blue-100" placeholder="Chapter name" />
                            <button id="addChapterBtn" type="button" class="rounded border border-blue-700 bg-blue-600 px-3 py-2 text-xs font-bold text-white shadow-sm hover:bg-blue-700">Add Chapter</button>
                        </div>
                        <div id="chapters" class="space-y-3"></div>
                    </div>

                    <div class="form-actions flex gap-2">
                        <button type="submit" class="rounded-lg border border-blue-700 bg-blue-600 px-3 py-2 text-sm font-bold text-white shadow-sm hover:bg-blue-700">Save Course</button>
                        <button id="cancelEditBtn" type="button" class="hidden rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-bold text-slate-700 shadow-sm hover:bg-slate-50">Cancel Edit</button>
                        <button id="deleteCourseBtn" type="button" class="hidden rounded-lg border border-rose-700 bg-rose-600 px-3 py-2 text-sm font-bold text-white shadow-sm hover:bg-rose-700">Delete Course</button>
                    </div>
                </form>
            </section>

            <section class="admin-panel rounded-lg border border-cyan-200 p-4 shadow-card md:p-5">
                <div id="status" class="mb-3 rounded-lg border border-cyan-200 bg-cyan-50 px-3 py-2 text-sm font-semibold text-cyan-900">Ready</div>
                <section class="mb-4 rounded-lg border border-amber-200 bg-amber-50/70 p-4">
                    <div class="mb-3">
                        <h2 class="text-lg font-extrabold text-amber-950">Ad Placements</h2>
                        <p class="text-xs font-semibold text-amber-800">These sections are visible on the study page for admin users only.</p>
                    </div>
                    <form id="adsForm" class="space-y-4">
                        <div class="rounded-lg border border-amber-200 bg-white p-3">
                            <div class="mb-2 flex items-center justify-between gap-2">
                                <h3 class="font-extrabold text-slate-950">Hero Banner</h3>
                                <label class="flex items-center gap-2 text-xs font-bold text-slate-700"><input id="heroEnabled" type="checkbox" class="h-4 w-4" /> Enabled</label>
                            </div>
                            <div class="grid gap-2">
                                <div class="rounded-lg border border-dashed border-amber-300 bg-amber-50/60 p-3">
                                    <div class="mb-2 text-xs font-extrabold uppercase tracking-[0.16em] text-amber-700">Upload Image</div>
                                    <input id="heroImageFile" type="file" accept="image/*" class="block w-full text-sm" />
                                    <img id="heroImagePreview" class="mt-3 hidden h-32 w-full rounded-lg object-cover" alt="Hero ad preview" />
                                </div>
                                <input id="heroEyebrow" class="field rounded-lg border border-slate-200 px-3 py-2 text-sm" placeholder="Eyebrow" />
                                <input id="heroTitle" class="field rounded-lg border border-slate-200 px-3 py-2 text-sm" placeholder="Title" />
                                <textarea id="heroDescription" class="field rounded-lg border border-slate-200 px-3 py-2 text-sm" rows="3" placeholder="Description"></textarea>
                                <div class="grid gap-2 sm:grid-cols-2">
                                    <input id="heroMeta" class="field rounded-lg border border-slate-200 px-3 py-2 text-sm" placeholder="Meta label" />
                                    <input id="heroCta" class="field rounded-lg border border-slate-200 px-3 py-2 text-sm" placeholder="CTA label" />
                                </div>
                            </div>
                        </div>
                        <div class="rounded-lg border border-amber-200 bg-white p-3">
                            <div class="mb-2 flex items-center justify-between gap-2">
                                <h3 class="font-extrabold text-slate-950">Sidebar Ad</h3>
                                <label class="flex items-center gap-2 text-xs font-bold text-slate-700"><input id="sidebarEnabled" type="checkbox" class="h-4 w-4" /> Enabled</label>
                            </div>
                            <div class="grid gap-2">
                                <div class="rounded-lg border border-dashed border-amber-300 bg-amber-50/60 p-3">
                                    <div class="mb-2 text-xs font-extrabold uppercase tracking-[0.16em] text-amber-700">Upload Image</div>
                                    <input id="sidebarImageFile" type="file" accept="image/*" class="block w-full text-sm" />
                                    <img id="sidebarImagePreview" class="mt-3 hidden h-32 w-full rounded-lg object-cover" alt="Sidebar ad preview" />
                                </div>
                                <input id="sidebarEyebrow" class="field rounded-lg border border-slate-200 px-3 py-2 text-sm" placeholder="Eyebrow" />
                                <input id="sidebarTitle" class="field rounded-lg border border-slate-200 px-3 py-2 text-sm" placeholder="Title" />
                                <textarea id="sidebarDescription" class="field rounded-lg border border-slate-200 px-3 py-2 text-sm" rows="3" placeholder="Description"></textarea>
                                <div class="grid gap-2 sm:grid-cols-2">
                                    <input id="sidebarMeta" class="field rounded-lg border border-slate-200 px-3 py-2 text-sm" placeholder="Meta label" />
                                    <input id="sidebarCta" class="field rounded-lg border border-slate-200 px-3 py-2 text-sm" placeholder="CTA label" />
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="rounded-lg border border-amber-700 bg-amber-500 px-3 py-2 text-sm font-bold text-white shadow-sm hover:bg-amber-600">Save Ad Settings</button>
                    </form>
                </section>
                <div id="admin" class="space-y-3"></div>
            </section>
        </div>
    </div>

    <script type="module">
        import { parseAuth, getUser, isAdmin, login } from "./auth.js?v=AUTH19";
        import { API } from "./api.js?v=AUTH19";

        await parseAuth();
        const user = getUser();
        if (!user) {
            await login();
            throw new Error("Redirecting to login");
        }

        if (!isAdmin()) {
            location.href = "/index.html";
            throw new Error("Not admin");
        }

        const status = document.getElementById("status");
        const adminBox = document.getElementById("admin");
        const chaptersBox = document.getElementById("chapters");
        const form = document.getElementById("courseForm");
        const formTitle = document.getElementById("formTitle");
        const cancelEditBtn = document.getElementById("cancelEditBtn");
        const deleteCourseBtn = document.getElementById("deleteCourseBtn");
        const idInput = document.getElementById("courseId");
        const nameInput = document.getElementById("courseName");
        const descInput = document.getElementById("courseDescription");
        const chapterNameInput = document.getElementById("chapterNameInput");
        const adsForm = document.getElementById("adsForm");
        const heroEnabled = document.getElementById("heroEnabled");
        const heroEyebrow = document.getElementById("heroEyebrow");
        const heroTitle = document.getElementById("heroTitle");
        const heroDescription = document.getElementById("heroDescription");
        const heroMeta = document.getElementById("heroMeta");
        const heroCta = document.getElementById("heroCta");
        const heroImageFile = document.getElementById("heroImageFile");
        const heroImagePreview = document.getElementById("heroImagePreview");
        const sidebarEnabled = document.getElementById("sidebarEnabled");
        const sidebarEyebrow = document.getElementById("sidebarEyebrow");
        const sidebarTitle = document.getElementById("sidebarTitle");
        const sidebarDescription = document.getElementById("sidebarDescription");
        const sidebarMeta = document.getElementById("sidebarMeta");
        const sidebarCta = document.getElementById("sidebarCta");
        const sidebarImageFile = document.getElementById("sidebarImageFile");
        const sidebarImagePreview = document.getElementById("sidebarImagePreview");

        let chapters = [];
        let editingCourseId = null;
        let siteSettings = null;
        let heroImageUrl = "";
        let sidebarImageUrl = "";
        const MAX_SETTINGS_IMAGE_BYTES = 220 * 1024;
        document.getElementById("backBtn").onclick = () => location.href = "/index.html";
        function createEmptyMcqDraft() {
            return {
                question: "",
                options: ["", "", "", ""],
                answerIndex: 0,
                difficulty: "easy"
            };
        }
        function createEmptyFlipDraft() {
            return { front: "", back: "" };
        }
        async function refreshEditingCourse(courseId) {
            const courses = await API.getCourses();
            renderCourses(courses);
            const course = courses.find(x => String(x.id) === String(courseId));
            if (course) {
                setEditMode(course);
            } else {
                resetForm();
            }
        }

        document.getElementById("addChapterBtn").onclick = async () => {
            const name = chapterNameInput.value.trim();
            if (!name || !name.trim()) return;
            const chapter = {
                id: crypto.randomUUID(),
                name: name.trim(),
                reference: "",
                mcqs: [],
                flips: [],
                ui: { showMcqEditor: false, showFlipEditor: false, mcqDraft: createEmptyMcqDraft(), flipDraft: createEmptyFlipDraft() }
            };

            if (editingCourseId) {
                status.textContent = "Adding chapter...";
                try {
                    await API.addCourseChapter(editingCourseId, chapter);
                    chapterNameInput.value = "";
                    await refreshEditingCourse(editingCourseId);
                    status.textContent = "Chapter added.";
                } catch (err) {
                    console.error("ADD CHAPTER ERROR:", err);
                    status.textContent = "Failed to add chapter.";
                    adminBox.innerHTML = `<pre class="text-red-600 whitespace-pre-wrap">${esc(String(err))}</pre>`;
                }
                return;
            }

            chapters.push(chapter);
            chapterNameInput.value = "";
            renderChapters();
        };

        function esc(s) {
            return String(s)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
        }

        function counts(course) {
            const ch = Array.isArray(course.chapters) ? course.chapters : [];
            return {
                chapters: ch.length,
                mcq: ch.reduce((n, c) => n + (Array.isArray(c.mcqs) ? c.mcqs.length : 0), 0),
                flip: ch.reduce((n, c) => n + (Array.isArray(c.flips) ? c.flips.length : 0), 0)
            };
        }

        function diffClass(diff) {
            if (diff === "easy") return "bg-emerald-100 text-emerald-800 border border-emerald-300";
            if (diff === "medium") return "bg-amber-100 text-amber-800 border border-amber-300";
            return "bg-rose-100 text-rose-800 border border-rose-300";
        }

        function ensureChapterUi(ch) {
            if (!ch.ui) {
                ch.ui = { showMcqEditor: false, showFlipEditor: false, mcqDraft: createEmptyMcqDraft(), flipDraft: createEmptyFlipDraft() };
            }
            if (!ch.ui.mcqDraft) ch.ui.mcqDraft = createEmptyMcqDraft();
            if (!ch.ui.flipDraft) ch.ui.flipDraft = createEmptyFlipDraft();
        }

        function renderChapters() {
            chapters.forEach(ensureChapterUi);
            chaptersBox.innerHTML = chapters.map(ch => `
                <div class="action-card rounded-lg border border-blue-100 bg-white p-3" data-ch-id="${esc(ch.id)}">
                    <div class="mb-2 flex items-center justify-between">
                        <input data-ch-name="${esc(ch.id)}" class="field rounded border border-slate-200 px-2 py-1 text-sm font-bold text-blue-950" value="${esc(ch.name)}" />
                        <div class="rounded bg-blue-50 px-2 py-0.5 text-xs font-bold text-blue-700">MCQ: ${ch.mcqs.length} | Flip: ${ch.flips.length}</div>
                    </div>
                    <textarea data-ch-reference="${esc(ch.id)}" class="field mb-2 w-full rounded border border-slate-200 px-2 py-2 text-xs text-slate-700" rows="3" placeholder="Chapter reference notes for students">${esc(ch.reference || "")}</textarea>
                    <div class="chapter-card-actions mb-2 flex flex-wrap gap-2">
                        <button type="button" class="rounded border border-cyan-700 bg-cyan-600 px-2 py-1 text-xs font-bold text-white hover:bg-cyan-700" data-save-ch="${esc(ch.id)}">Save Chapter</button>
                        <button type="button" class="rounded border border-blue-700 bg-blue-600 px-2 py-1 text-xs font-bold text-white hover:bg-blue-700" data-toggle-mcq="${esc(ch.id)}">${ch.ui.showMcqEditor ? "Close MCQ" : "Add MCQ"}</button>
                        <button type="button" class="rounded border border-slate-300 bg-white px-2 py-1 text-xs font-bold text-slate-700 hover:bg-slate-50" data-toggle-flip="${esc(ch.id)}">${ch.ui.showFlipEditor ? "Close Flip" : "Add Flip Card"}</button>
                        <button type="button" class="rounded border border-rose-700 bg-rose-600 px-2 py-1 text-xs font-bold text-white hover:bg-rose-700" data-del-ch="${esc(ch.id)}">Delete Chapter</button>
                    </div>
                    ${ch.ui.showMcqEditor ? `
                        <div class="mb-2 rounded-lg border border-blue-100 bg-blue-50 p-3">
                            <div class="mb-2 text-xs font-extrabold text-blue-900">New MCQ</div>
                            <div class="space-y-2">
                                <input data-mcq-question="${esc(ch.id)}" class="field w-full rounded border border-slate-200 px-2 py-1.5 text-xs" placeholder="Question" value="${esc(ch.ui.mcqDraft.question)}" />
                                <div class="grid gap-2 sm:grid-cols-2">
                                    ${ch.ui.mcqDraft.options.map((opt, i) => `
                                        <input data-mcq-option="${esc(ch.id)}:${i}" class="field rounded border border-slate-200 px-2 py-1.5 text-xs" placeholder="Option ${i + 1}" value="${esc(opt)}" />
                                    `).join("")}
                                </div>
                                <div class="grid gap-2 sm:grid-cols-2">
                                    <select data-mcq-answer="${esc(ch.id)}" class="field rounded border border-slate-200 px-2 py-1.5 text-xs">
                                        ${ch.ui.mcqDraft.options.map((_, i) => `<option value="${i}" ${ch.ui.mcqDraft.answerIndex === i ? "selected" : ""}>Correct option ${i + 1}</option>`).join("")}
                                    </select>
                                    <select data-mcq-difficulty="${esc(ch.id)}" class="field rounded border border-slate-200 px-2 py-1.5 text-xs">
                                        <option value="easy" ${ch.ui.mcqDraft.difficulty === "easy" ? "selected" : ""}>Easy</option>
                                        <option value="medium" ${ch.ui.mcqDraft.difficulty === "medium" ? "selected" : ""}>Medium</option>
                                        <option value="hard" ${ch.ui.mcqDraft.difficulty === "hard" ? "selected" : ""}>Hard</option>
                                    </select>
                                </div>
                                <button type="button" data-save-mcq="${esc(ch.id)}" class="rounded border border-blue-700 bg-blue-600 px-2 py-1 text-xs font-bold text-white hover:bg-blue-700">Save MCQ</button>
                            </div>
                        </div>
                    ` : ""}
                    ${ch.ui.showFlipEditor ? `
                        <div class="mb-2 rounded-lg border border-slate-200 bg-slate-50 p-3">
                            <div class="mb-2 text-xs font-extrabold text-slate-700">New Flip Card</div>
                            <div class="space-y-2">
                                <input data-flip-front="${esc(ch.id)}" class="field w-full rounded border border-slate-200 px-2 py-1.5 text-xs" placeholder="Front text" value="${esc(ch.ui.flipDraft.front)}" />
                                <textarea data-flip-back="${esc(ch.id)}" class="field w-full rounded border border-slate-200 px-2 py-1.5 text-xs" rows="2" placeholder="Back text">${esc(ch.ui.flipDraft.back)}</textarea>
                                <button type="button" data-save-flip="${esc(ch.id)}" class="rounded border border-slate-700 bg-slate-700 px-2 py-1 text-xs font-bold text-white hover:bg-slate-800">Save Flip Card</button>
                            </div>
                        </div>
                    ` : ""}
                    <div class="space-y-1 text-xs text-slate-700">
                        ${ch.mcqs.map((m, i) => `
                            <div class="flex items-start justify-between gap-2 rounded border border-blue-100 bg-blue-50 px-2 py-1 font-semibold text-blue-950">
                                <div>MCQ ${i + 1} <span class="ml-1 rounded px-1.5 py-0.5 ${diffClass(m.difficulty || "easy")}">${esc(m.difficulty || "easy")}</span> ${esc(m.question)}</div>
                                <button type="button" class="shrink-0 rounded border border-rose-300 bg-white px-2 py-0.5 text-[10px] font-extrabold uppercase tracking-wide text-rose-700 hover:bg-rose-50" data-del-mcq="${esc(ch.id)}:${i}">Delete</button>
                            </div>
                        `).join("")}
                        ${ch.flips.map((f, i) => `
                            <div class="flex items-start justify-between gap-2 rounded border border-slate-200 bg-slate-50 px-2 py-1 font-semibold text-slate-700">
                                <div>Flip ${i + 1}: ${esc(f.front)}</div>
                                <button type="button" class="shrink-0 rounded border border-rose-300 bg-white px-2 py-0.5 text-[10px] font-extrabold uppercase tracking-wide text-rose-700 hover:bg-rose-50" data-del-flip="${esc(ch.id)}:${i}">Delete</button>
                            </div>
                        `).join("")}
                    </div>
                </div>
            `).join("");

            chaptersBox.querySelectorAll("[data-toggle-mcq]").forEach(btn => {
                btn.onclick = () => {
                    const id = btn.getAttribute("data-toggle-mcq");
                    const ch = chapters.find(x => x.id === id);
                    if (!ch) return;
                    ensureChapterUi(ch);
                    ch.ui.showMcqEditor = !ch.ui.showMcqEditor;
                    if (ch.ui.showMcqEditor) ch.ui.showFlipEditor = false;
                    renderChapters();
                };
            });

            chaptersBox.querySelectorAll("[data-toggle-flip]").forEach(btn => {
                btn.onclick = () => {
                    const id = btn.getAttribute("data-toggle-flip");
                    const ch = chapters.find(x => x.id === id);
                    if (!ch) return;
                    ensureChapterUi(ch);
                    ch.ui.showFlipEditor = !ch.ui.showFlipEditor;
                    if (ch.ui.showFlipEditor) ch.ui.showMcqEditor = false;
                    renderChapters();
                };
            });

            chaptersBox.querySelectorAll("[data-save-mcq]").forEach(btn => {
                btn.onclick = () => {
                    const id = btn.getAttribute("data-save-mcq");
                    const ch = chapters.find(x => x.id === id);
                    if (!ch) return;
                    const questionInput = chaptersBox.querySelector(`[data-mcq-question="${id}"]`);
                    const answerSelect = chaptersBox.querySelector(`[data-mcq-answer="${id}"]`);
                    const difficultySelect = chaptersBox.querySelector(`[data-mcq-difficulty="${id}"]`);
                    const optionsRaw = [0, 1, 2, 3]
                        .map(i => chaptersBox.querySelector(`[data-mcq-option="${id}:${i}"]`)?.value.trim() || "");
                    const nonEmptyCount = optionsRaw.filter(Boolean).length;

                    const question = questionInput?.value.trim() || "";
                    if (!question) return alert("Question is required.");
                    if (nonEmptyCount < 2) return alert("At least 2 options are required.");

                    const idx = Number(answerSelect?.value ?? "0");
                    if (!Number.isInteger(idx) || idx < 0 || idx >= 4) return alert("Invalid correct answer.");
                    if (!optionsRaw[idx]) return alert("Correct answer option cannot be empty.");
                    const options = optionsRaw.slice();

                    const difficulty = String(difficultySelect?.value || "easy");
                    ch.mcqs.push({ question, options, answerIndex: idx, difficulty });
                    ch.ui.mcqDraft = createEmptyMcqDraft();
                    ch.ui.showMcqEditor = false;
                    renderChapters();
                };
            });

            chaptersBox.querySelectorAll("[data-save-flip]").forEach(btn => {
                btn.onclick = () => {
                    const id = btn.getAttribute("data-save-flip");
                    const ch = chapters.find(x => x.id === id);
                    if (!ch) return;
                    const front = chaptersBox.querySelector(`[data-flip-front="${id}"]`)?.value.trim() || "";
                    const back = chaptersBox.querySelector(`[data-flip-back="${id}"]`)?.value.trim() || "";
                    if (!front || !back) return alert("Front and back are required.");
                    ch.flips.push({ front, back });
                    ch.ui.flipDraft = createEmptyFlipDraft();
                    ch.ui.showFlipEditor = false;
                    renderChapters();
                };
            });

            chaptersBox.querySelectorAll("[data-del-ch]").forEach(btn => {
                btn.onclick = async () => {
                    const id = btn.getAttribute("data-del-ch");
                    if (editingCourseId) {
                        const ok = confirm("Delete this chapter? This cannot be undone.");
                        if (!ok) return;
                        status.textContent = "Deleting chapter...";
                        try {
                            await API.deleteCourseChapter(editingCourseId, id);
                            await refreshEditingCourse(editingCourseId);
                            status.textContent = "Chapter deleted.";
                        } catch (err) {
                            console.error("DELETE CHAPTER ERROR:", err);
                            status.textContent = "Failed to delete chapter.";
                            adminBox.innerHTML = `<pre class="text-red-600 whitespace-pre-wrap">${esc(String(err))}</pre>`;
                        }
                        return;
                    }
                    chapters = chapters.filter(x => x.id !== id);
                    renderChapters();
                };
            });

            chaptersBox.querySelectorAll("[data-del-mcq]").forEach(btn => {
                btn.onclick = () => {
                    const raw = btn.getAttribute("data-del-mcq") || "";
                    const [chapterId, indexRaw] = raw.split(":");
                    const ch = chapters.find(x => x.id === chapterId);
                    const index = Number(indexRaw);
                    if (!ch || !Number.isInteger(index)) return;
                    ch.mcqs.splice(index, 1);
                    renderChapters();
                };
            });

            chaptersBox.querySelectorAll("[data-del-flip]").forEach(btn => {
                btn.onclick = () => {
                    const raw = btn.getAttribute("data-del-flip") || "";
                    const [chapterId, indexRaw] = raw.split(":");
                    const ch = chapters.find(x => x.id === chapterId);
                    const index = Number(indexRaw);
                    if (!ch || !Number.isInteger(index)) return;
                    ch.flips.splice(index, 1);
                    renderChapters();
                };
            });

            chaptersBox.querySelectorAll("[data-save-ch]").forEach(btn => {
                btn.onclick = async () => {
                    const id = btn.getAttribute("data-save-ch");
                    const ch = chapters.find(x => x.id === id);
                    if (!ch) return;

                    const nameInputEl = chaptersBox.querySelector(`[data-ch-name="${id}"]`);
                    const referenceInputEl = chaptersBox.querySelector(`[data-ch-reference="${id}"]`);
                    const nextName = nameInputEl?.value.trim() || "";
                    if (!nextName) return alert("Chapter name is required.");
                    ch.name = nextName;
                    ch.reference = referenceInputEl?.value || "";

                    if (editingCourseId) {
                        status.textContent = "Saving chapter...";
                        try {
                            await API.updateCourseChapter(editingCourseId, id, {
                                id: ch.id,
                                name: ch.name,
                                reference: ch.reference,
                                mcqs: ch.mcqs,
                                flips: ch.flips
                            });
                            await refreshEditingCourse(editingCourseId);
                            status.textContent = "Chapter saved.";
                        } catch (err) {
                            console.error("SAVE CHAPTER ERROR:", err);
                            status.textContent = "Failed to save chapter.";
                            adminBox.innerHTML = `<pre class="text-red-600 whitespace-pre-wrap">${esc(String(err))}</pre>`;
                        }
                        return;
                    }

                    renderChapters();
                };
            });
        }

        function resetForm() {
            form.reset();
            idInput.readOnly = false;
            editingCourseId = null;
            chapters = [];
            renderChapters();
            formTitle.textContent = "Add Course";
            cancelEditBtn.classList.add("hidden");
            deleteCourseBtn.classList.add("hidden");
        }

        function fillAdsForm(settings) {
            const hero = settings?.ads?.hero || {};
            const sidebar = settings?.ads?.sidebar || {};
            heroEnabled.checked = hero.enabled !== false;
            heroEyebrow.value = hero.eyebrow || "";
            heroTitle.value = hero.title || "";
            heroDescription.value = hero.description || "";
            heroMeta.value = hero.meta || "";
            heroCta.value = hero.cta || "";
            heroImageUrl = hero.imageUrl || "";
            heroImagePreview.src = heroImageUrl;
            heroImagePreview.classList.toggle("hidden", !heroImageUrl);
            sidebarEnabled.checked = sidebar.enabled !== false;
            sidebarEyebrow.value = sidebar.eyebrow || "";
            sidebarTitle.value = sidebar.title || "";
            sidebarDescription.value = sidebar.description || "";
            sidebarMeta.value = sidebar.meta || "";
            sidebarCta.value = sidebar.cta || "";
            sidebarImageUrl = sidebar.imageUrl || "";
            sidebarImagePreview.src = sidebarImageUrl;
            sidebarImagePreview.classList.toggle("hidden", !sidebarImageUrl);
        }

        function dataUrlBytes(dataUrl) {
            const base64 = String(dataUrl || "").split(",")[1] || "";
            return Math.ceil((base64.length * 3) / 4);
        }

        function loadImageFromFile(file) {
            return new Promise((resolve, reject) => {
                const objectUrl = URL.createObjectURL(file);
                const image = new Image();
                image.onload = () => {
                    URL.revokeObjectURL(objectUrl);
                    resolve(image);
                };
                image.onerror = (err) => {
                    URL.revokeObjectURL(objectUrl);
                    reject(err);
                };
                image.src = objectUrl;
            });
        }

        async function fileToDataUrl(file, targetWidth, quality = 0.82) {
            const image = await loadImageFromFile(file);
            const scale = Math.min(1, targetWidth / image.width);
            const width = Math.max(1, Math.round(image.width * scale));
            const height = Math.max(1, Math.round(image.height * scale));
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const context = canvas.getContext("2d");
            context.drawImage(image, 0, 0, width, height);

            let outputQuality = quality;
            let dataUrl = canvas.toDataURL("image/jpeg", outputQuality);
            while (dataUrlBytes(dataUrl) > MAX_SETTINGS_IMAGE_BYTES && outputQuality > 0.45) {
                outputQuality -= 0.08;
                dataUrl = canvas.toDataURL("image/jpeg", outputQuality);
            }

            if (dataUrlBytes(dataUrl) > MAX_SETTINGS_IMAGE_BYTES) {
                throw new Error("Image is still too large after compression. Use a smaller image.");
            }

            return dataUrl;
        }

        function setEditMode(course) {
            formTitle.textContent = `Edit Course: ${course.id}`;
            idInput.value = course.id || "";
            idInput.readOnly = true;
            editingCourseId = course.id || null;
            nameInput.value = course.name || "";
            descInput.value = course.description || "";
            const source = Array.isArray(course.chapters) ? course.chapters : [];
            chapters = source.map(ch => ({
                id: ch.id || crypto.randomUUID(),
                name: ch.name || "Untitled Chapter",
                reference: ch.reference || "",
                mcqs: Array.isArray(ch.mcqs)
                    ? ch.mcqs.map(m => ({
                        question: m.question || "",
                        options: Array.isArray(m.options) ? m.options : [],
                        answerIndex: Number.isInteger(m.answerIndex) ? m.answerIndex : 0,
                        difficulty: ["easy", "medium", "hard"].includes(String(m.difficulty || "").toLowerCase()) ? String(m.difficulty).toLowerCase() : "easy"
                    }))
                    : [],
                flips: Array.isArray(ch.flips) ? ch.flips : [],
                ui: { showMcqEditor: false, showFlipEditor: false, mcqDraft: createEmptyMcqDraft(), flipDraft: createEmptyFlipDraft() }
            }));
            renderChapters();
            cancelEditBtn.classList.remove("hidden");
            deleteCourseBtn.classList.remove("hidden");
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function renderCourses(courses) {
            if (!courses.length) {
                status.textContent = "No courses found yet.";
                adminBox.innerHTML = "";
                return;
            }
            status.textContent = `Loaded ${courses.length} course(s).`;
            adminBox.innerHTML = courses.map(c => {
                const x = counts(c);
                return `
                    <div class="action-card rounded-lg border border-blue-100 bg-white p-3 shadow-card">
                        <div class="flex items-start justify-between gap-2">
                            <div>
                                <div class="text-sm font-extrabold text-blue-950">${esc(c.name || "(untitled)")}</div>
                                <div class="font-mono text-[11px] font-semibold text-cyan-700">ID ${esc(c.id || "n/a")}</div>
                            </div>
                            <div class="course-card-actions flex flex-wrap gap-2">
                                <button class="rounded border border-blue-700 bg-blue-600 px-2 py-1 text-xs font-bold text-white hover:bg-blue-700" data-open-id="${esc(c.id || "")}">Open</button>
                                <button class="rounded border border-slate-300 bg-white px-2 py-1 text-xs font-bold text-slate-700 hover:bg-slate-50" data-edit-id="${esc(c.id || "")}">Edit</button>
                                <button class="rounded border border-rose-700 bg-rose-600 px-2 py-1 text-xs font-bold text-white hover:bg-rose-700" data-delete-id="${esc(c.id || "")}">Delete</button>
                            </div>
                        </div>
                        <div class="mt-2 text-xs font-medium text-slate-700 whitespace-pre-wrap">${esc(c.description || "")}</div>
                        <div class="mt-2 text-xs font-bold text-blue-800">${x.chapters} chapters | ${x.mcq} MCQs | ${x.flip} cards</div>
                    </div>
                `;
            }).join("");

            adminBox.querySelectorAll("[data-open-id]").forEach(btn => {
                btn.onclick = () => {
                    const id = btn.getAttribute("data-open-id") || "";
                    location.href = `/index.html?course=${encodeURIComponent(id)}`;
                };
            });
            adminBox.querySelectorAll("[data-edit-id]").forEach(btn => {
                btn.onclick = () => {
                    const id = btn.getAttribute("data-edit-id");
                    const course = courses.find(x => x.id === id);
                    if (course) setEditMode(course);
                };
            });
            adminBox.querySelectorAll("[data-delete-id]").forEach(btn => {
                btn.onclick = async () => {
                    const id = btn.getAttribute("data-delete-id") || "";
                    if (!id) return;
                    const ok = confirm(`Delete course "${id}"? This cannot be undone.`);
                    if (!ok) return;
                    status.textContent = "Deleting course...";
                    try {
                        await API.deleteCourse(id);
                        if (editingCourseId === id) resetForm();
                        await loadCourses();
                        status.textContent = `Deleted course ${id}.`;
                    } catch (err) {
                        console.error("DELETE COURSE ERROR:", err);
                        status.textContent = "Failed to delete course.";
                        adminBox.innerHTML = `<pre class="text-red-600 whitespace-pre-wrap">${esc(String(err))}</pre>`;
                    }
                };
            });
        }

        async function loadCourses() {
            status.textContent = "Loading courses...";
            const courses = await API.getCourses();
            renderCourses(courses);
        }

        cancelEditBtn.onclick = resetForm;
        heroImageFile.addEventListener("change", async (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            try {
                heroImageUrl = await fileToDataUrl(file, 1200, 0.82);
                heroImagePreview.src = heroImageUrl;
                heroImagePreview.classList.remove("hidden");
                status.textContent = "Hero image prepared.";
            } catch (err) {
                console.error("HERO IMAGE ERROR:", err);
                heroImageUrl = "";
                heroImageFile.value = "";
                heroImagePreview.src = "";
                heroImagePreview.classList.add("hidden");
                status.textContent = err.message || "Failed to prepare hero image.";
            }
        });

        sidebarImageFile.addEventListener("change", async (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            try {
                sidebarImageUrl = await fileToDataUrl(file, 480, 0.8);
                sidebarImagePreview.src = sidebarImageUrl;
                sidebarImagePreview.classList.remove("hidden");
                status.textContent = "Sidebar image prepared.";
            } catch (err) {
                console.error("SIDEBAR IMAGE ERROR:", err);
                sidebarImageUrl = "";
                sidebarImageFile.value = "";
                sidebarImagePreview.src = "";
                sidebarImagePreview.classList.add("hidden");
                status.textContent = err.message || "Failed to prepare sidebar image.";
            }
        });

        adsForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const payload = {
                ads: {
                    hero: {
                        enabled: heroEnabled.checked,
                        eyebrow: heroEyebrow.value.trim(),
                        title: heroTitle.value.trim(),
                        description: heroDescription.value.trim(),
                        meta: heroMeta.value.trim(),
                        cta: heroCta.value.trim(),
                        imageUrl: heroImageUrl
                    },
                    sidebar: {
                        enabled: sidebarEnabled.checked,
                        eyebrow: sidebarEyebrow.value.trim(),
                        title: sidebarTitle.value.trim(),
                        description: sidebarDescription.value.trim(),
                        meta: sidebarMeta.value.trim(),
                        cta: sidebarCta.value.trim(),
                        imageUrl: sidebarImageUrl
                    }
                }
            };
            status.textContent = "Saving ad settings...";
            try {
                siteSettings = await API.saveSettings(payload);
                fillAdsForm(siteSettings);
                status.textContent = "Ad settings saved.";
            } catch (err) {
                console.error("SAVE SETTINGS ERROR:", err);
                status.textContent = "Failed to save ad settings.";
                adminBox.innerHTML = `<pre class="text-red-600 whitespace-pre-wrap">${esc(String(err))}</pre>`;
            }
        });
        deleteCourseBtn.onclick = async () => {
            if (!editingCourseId) return;
            const ok = confirm(`Delete course "${editingCourseId}"? This cannot be undone.`);
            if (!ok) return;
            status.textContent = "Deleting course...";
            try {
                await API.deleteCourse(editingCourseId);
                resetForm();
                await loadCourses();
                status.textContent = `Deleted course ${editingCourseId}.`;
            } catch (err) {
                console.error("DELETE COURSE ERROR:", err);
                status.textContent = "Failed to delete course.";
                adminBox.innerHTML = `<pre class="text-red-600 whitespace-pre-wrap">${esc(String(err))}</pre>`;
            }
        };
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const payload = {
                id: idInput.value.trim(),
                name: nameInput.value.trim(),
                description: descInput.value,
                chapters
            };
            const isEdit = Boolean(editingCourseId);
            status.textContent = isEdit ? "Updating course..." : "Saving course...";
            try {
                if (isEdit) {
                    await API.updateCourse(editingCourseId, payload);
                } else {
                    await API.saveCourse(payload);
                }
                resetForm();
                await loadCourses();
            } catch (err) {
                console.error("SAVE COURSE ERROR:", err);
                status.textContent = isEdit ? "Failed to update course." : "Failed to save course.";
                adminBox.innerHTML = `<pre class="text-red-600 whitespace-pre-wrap">${esc(String(err))}</pre>`;
            }
        });

        resetForm();
        try {
            try {
                siteSettings = await API.getSettings();
                fillAdsForm(siteSettings);
            } catch (err) {
                console.error("SETTINGS LOAD ERROR:", err);
            }
            await loadCourses();
        } catch (err) {
            console.error("ADMIN API ERROR:", err);
            status.textContent = "Failed to load courses.";
            adminBox.innerHTML = `<pre class="text-red-600 whitespace-pre-wrap">${esc(String(err))}</pre>`;
        }
    </script>
</body>

</html>
