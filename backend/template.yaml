AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Parameters:
  FrontendOrigin:
    Type: String
    Default: https://coursemastery.netlify.app
    Description: Exact HTTPS origin allowed to call the API.
    AllowedPattern: ^https://[A-Za-z0-9.-]+(?::[0-9]+)?$
  CognitoUserPoolArn:
    Type: String
    Default: arn:aws:cognito-idp:eu-central-1:672626785669:userpool/eu-central-1_fVi49DC6p
    Description: Cognito user pool ARN used by the API authorizer.

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 30
    MemorySize: 256
    Tracing: Active

  Api:
    TracingEnabled: true
    MinimumCompressionSize: 1024
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowOrigin: !Sub "'${FrontendOrigin}'"
      MaxAge: "'600'"
    MethodSettings:
      - ResourcePath: /guest/questions
        HttpMethod: GET
        MetricsEnabled: true
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
      - ResourcePath: /feedback
        HttpMethod: POST
        MetricsEnabled: true
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 1
    Auth:
      DefaultAuthorizer: CognitoAuthorizer
      AddDefaultAuthorizerToCorsPreflight: false
      Authorizers:
        CognitoAuthorizer:
          UserPoolArn: !Ref CognitoUserPoolArn

Resources:
  # ====================
  # DynamoDB Tables
  # ====================

  CoursesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  ProgressTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: courseId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: courseId
          KeyType: RANGE

  FeedbackTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ====================
  # Lambda Functions
  # ====================

  CoursesFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: courses.handler
      Environment:
        Variables:
          TABLE: !Ref CoursesTable
          FEEDBACK_TABLE: !Ref FeedbackTable
          ALLOWED_ORIGIN: !Ref FrontendOrigin
          GUEST_CACHE_SECONDS: 300
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CoursesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FeedbackTable
      Events:
        ApiGuestQuestions:
          Type: Api
          Properties:
            Path: /guest/questions
            Method: GET
            Auth:
              Authorizer: NONE
        ApiSubmitFeedback:
          Type: Api
          Properties:
            Path: /feedback
            Method: POST
            Auth:
              Authorizer: NONE
        ApiFeedbackAdmin:
          Type: Api
          Properties:
            Path: /feedback
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        Api:
          Type: Api
          Properties:
            Path: /courses
            Method: ANY
            Auth:
              Authorizer: CognitoAuthorizer
        ApiById:
          Type: Api
          Properties:
            Path: /courses/{id}
            Method: ANY
            Auth:
              Authorizer: CognitoAuthorizer
        ApiChapters:
          Type: Api
          Properties:
            Path: /courses/{id}/chapters
            Method: ANY
            Auth:
              Authorizer: CognitoAuthorizer
        ApiChapterById:
          Type: Api
          Properties:
            Path: /courses/{id}/chapters/{chapterId}
            Method: ANY
            Auth:
              Authorizer: CognitoAuthorizer
        ApiSettings:
          Type: Api
          Properties:
            Path: /settings
            Method: ANY
            Auth:
              Authorizer: CognitoAuthorizer

  ProgressFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: progress.handler
      Environment:
        Variables:
          TABLE: !Ref ProgressTable
          ALLOWED_ORIGIN: !Ref FrontendOrigin
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProgressTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /progress/{courseId}
            Method: ANY
            Auth:
              Authorizer: CognitoAuthorizer

# ====================
# Stack Outputs
# ====================

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  FeedbackTableName:
    Description: DynamoDB table containing learner feedback responses
    Value: !Ref FeedbackTable
